<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
	<style>
		.carousel-caption-top {
		  top: 10px;
		  bottom: auto;
		  color: black;
		}
		  

		
	  </style>
</head>
<body style="background-color: rgb(223, 221, 219);">
	<div id="myCarousel" class="carousel slide" data-ride="carousel">
		<div class="carousel-inner text-center">
			
		  <div class="carousel-item active">
			<div class="carousel-caption carousel-caption-top position-absolute w-100 text-center">
				<h3>Step 1</h3> 
		</div>
			<img class="d-block mx-auto " src="./images/Step 1 [Agrobacterium]-Photoroom.png" alt="First slide">
			
		</div>
		  <div class="carousel-item">
			<img class="d-block mx-auto" src="./images/Step 2 [Agrobacterium]-Photoroom.png" alt="Second slide">
			<div class="carousel-caption carousel-caption-top position-absolute w-100 text-center">
				<h3>Step 2</h3> 
		</div>  
		</div>
		  <div class="carousel-item">
			<img class="d-block mx-auto" src="./images/Step 3 [Agrobacterium]-Photoroom.png" alt="Third slide">
			<div class="carousel-caption carousel-caption-top position-absolute w-100 text-center">
				<h3>Step 3</h3> 
		</div> 
		</div>
		  <div class="carousel-item">
			<img class="d-block mx-auto" src="./images/Step 4 [Agrobacterium]-Photoroom.png" alt="Fourth slide">
			<div class="carousel-caption carousel-caption-top position-absolute w-100 text-center">
				<h3>Step 4</h3> 
		</div>  
		</div>
		  <div class="carousel-item">
			<img class="d-block mx-auto" src="./images/Step 5 [Agrobacterium]-Photoroom.png" alt="Fifth slide">
			<div class="carousel-caption carousel-caption-top position-absolute w-100 text-center">
				<h3>Step 5</h3> 
		</div>  
		</div>
		  <div class="carousel-item">
			<img class="d-block mx-auto" src="./images/Step 6 [Agrobacterium]-Photoroom.png" alt="Sixth slide">
			<div class="carousel-caption carousel-caption-top position-absolute w-100 text-center">
				<h3>Step 6</h3> 
		</div>  
		</div>
		</div>
		<button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
			<span class="carousel-control-prev-icon" ></span>
			<span class="visually-hidden"></span>
		</button>
		<button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
			<span class="carousel-control-next-icon"></span>
			<span class="visually-hidden"></span>
		</button>
	  </div>

	<!-- Add JS at the bottom of HTML file --> 
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="./js/main.js"></script>
</body>
</html>
