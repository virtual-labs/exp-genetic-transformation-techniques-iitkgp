<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		.carousel-caption-top {
		  top: 10px;
		  bottom: auto;
		  color: black;
		}
		.carousel-control-prev-icon,
    .carousel-control-next-icon {
      background-image: none;
      width: 2rem;
      height: 2rem;
      border: solid black;
      border-width: 0 4px 4px 0;
      padding: 6px;
      transform: rotate(45deg);
    }
	.carousel-control-prev-icon {
      transform: rotate(135deg);
    }
    .carousel-control-next-icon {
      transform: rotate(-45deg);
    }
	  </style>
</head>

<body >
<div class="container text-center my-4">
  <h3 id="carousel-heading">Step 1.	Preparation of Microcarrier Particles: </h3>
  <h4 id="carousel-paragraph">Microcarrier particles, typically made of gold or tungsten, are prepared to carry the desired genetic material.</h4>
</div>
</div>
	<div id="myCarousel" class="carousel slide" data-bs-ride="carousel">
		<!-- Indicators -->
		<!--div class="carousel-indicators">
			<button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active"></button>
			<button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1"></button>
			<button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2"></button>
		</div-->

		<!-- Carousel Inner -->
		<div class="carousel-inner text-center">
			<div class="carousel-item active" data-caption-title="Step 1. Preparation of Microcarrier Particles" data-caption-text=" Microcarrier particles, typically made of gold or tungsten, are prepared to carry the desired genetic material.">
				<img src="./images/Step1.png" class="d-block mx-auto" alt="First Slide">
				
			</div>
			<div class="carousel-item" data-caption-title="Step 2. Coating Microcarrier with Genetic Material" data-caption-text="The genetic material is coated onto the surface of the microcarrier particles to ensure it adheres during delivery.">
				<img src="./images/Step2.png" class="d-block mx-auto"
					alt="Second Slide">
					
				</div>
			<div class="carousel-item" data-caption-title="Step 3. Loading into Gene Gun" data-caption-text="The coated particles are then loaded into the gene gun, which utilizes pressurized helium to launch the particles.">
				<img src="./images/Step3.png" class="d-block mx-auto" alt="Third Slide">
				
			</div>
			<div class="carousel-item" data-caption-title="Step 4. Pressure Activation" data-caption-text="A breach disk inside the gene gun breaks upon pressure build-up, releasing gas to propel the macrocarrier holding the microcarriers toward the target.">
				<img src="./images/Step4.png" class="d-block mx-auto" alt="Fourth Slide">
				
			</div>
			<div class="carousel-item" data-caption-title="Step 5. Macrocarrier Stopping" data-caption-text="A stopping screen halts the macrocarrier, allowing only the microcarrier particles to pass through toward the target cells.">
				<img src="./images/Step5.png" class="d-block mx-auto" alt="Fifth Slide">
				
			</div>
			<div class="carousel-item" data-caption-title="Step 6. Target Cell Placement" data-caption-text="The target cells are placed on a Petri dish or growth plate within the gene gun chamber for exposure to the microcarriers.">
				<img src="./images/Step6.png" class="d-block mx-auto" alt="Sixth Slide">
				
			</div>
			<div class="carousel-item" data-caption-title="Step 7. Genetic Material Delivery" data-caption-text="The high-speed microcarrier particles penetrate the cell wall and membrane, entering the cytoplasm, where the genetic material is released, allowing for gene expression to begin within the plant cell.">
				<img src="./images/Step7.png" class="d-block mx-auto" alt="Seventh Slide">
				
			</div>
		</div>

		<!-- Controls -->
		<button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
			<span class="carousel-control-prev-icon"></span>
			<span class="visually-hidden"></span>
		</button>
		<button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
			<span class="carousel-control-next-icon"></span>
			<span class="visually-hidden"></span>
		</button>
	</div>

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		const carousel = document.querySelector('#myCarousel');
  const heading = document.querySelector('#carousel-heading');
  const paragraph = document.querySelector('#carousel-paragraph');

  carousel.addEventListener('slide.bs.carousel', function (e) {
    const nextSlide = e.relatedTarget;
    const title = nextSlide.getAttribute('data-caption-title');
    const text = nextSlide.getAttribute('data-caption-text');
    heading.textContent = title;
    paragraph.textContent = text;
  });
		
	  </script>
</body>

</html>
